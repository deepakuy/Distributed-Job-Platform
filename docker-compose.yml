version: "3.8"

services:
  postgres:
    image: postgres:16-alpine
    container_name: job_platform_postgres
    environment:
      POSTGRES_DB: job_platform
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d job_platform"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: job_platform_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: job_platform_api
    environment:
      - APP_NAME=Distributed Job Platform
      - APP_ENV=production
      - DEBUG=false
      - PORT=8000
      - HOST=0.0.0.0
      - JWT_SECRET_KEY=supersecretchangeitinproduction
      - JWT_ALGORITHM=HS256
      - DATABASE_URL=postgresql+asyncpg://postgres:postgres@postgres:5432/job_platform
      - REDIS_URL=redis://redis:6379/0
      - RATE_LIMIT_LIMIT=100
      - RATE_LIMIT_WINDOW=60
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: >
      sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000"

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: job_platform_worker
    environment:
      - APP_NAME=Distributed Job Platform
      - APP_ENV=production
      - DATABASE_URL=postgresql+asyncpg://postgres:postgres@postgres:5432/job_platform
      - REDIS_URL=redis://redis:6379/0
      - WORKER_CONCURRENCY=5
      - WORKER_HEARTBEAT_INTERVAL=5
      - WORKER_LEASE_DURATION=15
      - WORKER_REAPER_INTERVAL=10
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: python -m app.workers.run_worker

volumes:
  postgres_data:
  redis_data:
